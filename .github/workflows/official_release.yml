name: Official Release
run-name: "Official release ${{ inputs.release_version }}"

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Exact version to release
        required: true
        type: string
      release_version_type:
        description: Version type for Modrinth
        required: true
        type: choice
        default: release
        options:
          - release
          - beta
          - alpha

concurrency:
  group: release-${{ inputs.release_version }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  call_build:
    name: Build and release
    uses: ./.github/workflows/reusable_build.yml
    with:
      is-release-build: true
      release-version: ${{ inputs.release_version }}
      release-version-type: ${{ inputs.release_version_type }}
      publish-artifacts: true
    secrets: inherit