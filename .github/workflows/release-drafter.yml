name: Release drafter

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: release-drafter-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: read

jobs:
  draft:
    name: Update draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: drafter
        uses: release-drafter/release-drafter@v7
        with:
          commitish: dev
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
