name: Reusable Build and Publish

on:
  workflow_call:
    inputs:
      runner:
        description: 'The runner to use for the build job'
        required: false
        type: string
        default: 'ubuntu-latest'
      is-release-build:
        description: 'True if this is a release build'
        required: true
        type: boolean
      release-version:
        description: 'The explicit version for release builds'
        required: false
        type: string
        default: ''
      release-version-type:
        description: 'The version type for Modrinth'
        required: true
        type: string
      release-changelog:
        description: 'The changelog content for the release'
        required: false
        type: string
        default: ''
      publish-artifacts:
        description: 'If true uploads artifacts to GitHub Modrinth and custom API'
        required: true
        type: boolean
    secrets:
      MODRINTH_ID:
        required: false
      MODRINTH_TOKEN:
        required: false

jobs:
  build:
    name: Build
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: read

    env:
      MODRINTH_ID: ${{ secrets.MODRINTH_ID }}
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set Dynamic Build Version
        id: set_version
        run: |
          set -euo pipefail
          BASE_VERSION=$(sed -n 's/^version=//p' gradle.properties)
          
          if [[ "${{ inputs.is-release-build }}" == "true" ]]; then
            NEW_VERSION="${{ inputs.release-version }}"
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            CLEAN_VERSION=${BASE_VERSION%-SNAPSHOT}
            NEW_VERSION="${CLEAN_VERSION}-dev-${{ github.run_number }}-${SHORT_SHA}"
          fi
          
          echo "BUILD_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          echo "Build version set to $NEW_VERSION"

      - name: Build with Gradle
        run: ./gradlew --no-daemon --console=plain clean build -Pversion="$BUILD_VERSION"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: AstralPractice-${{ env.BUILD_VERSION }}
          path: distribution/build/libs/AstralPractice-${{ env.BUILD_VERSION }}.jar
          if-no-files-found: error
          retention-days: 14

      - name: Generate Changelog with Release Drafter
        if: ${{ inputs.publish-artifacts }}
        id: drafter
        uses: release-drafter/release-drafter@v7
        with:
          commitish: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Final Changelog
        if: ${{ inputs.publish-artifacts }}
        id: changelog
        run: |
          set -euo pipefail
          NOTES="${{ inputs.release-changelog }}"
          if [[ -z "$NOTES" ]]; then
            NOTES="${{ steps.drafter.outputs.body }}"
          fi
          if [[ -z "$NOTES" ]]; then
            NOTES="No new code changes in this build"
          fi

          delimiter="notes-$(openssl rand -hex 16)"
          {
            echo "notes<<$delimiter"
            echo "$NOTES"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: ${{ inputs.publish-artifacts && inputs.is-release-build }}
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ env.BUILD_VERSION }}
          name: AstralPractice ${{ env.BUILD_VERSION }}
          body: ${{ steps.changelog.outputs.notes }}
          prerelease: false
          files: distribution/build/libs/AstralPractice-${{ env.BUILD_VERSION }}.jar

      - name: Publish to Modrinth
        if: ${{ inputs.publish-artifacts && env.MODRINTH_ID != '' && env.MODRINTH_TOKEN != '' }}
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          modrinth-id: ${{ secrets.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: ${{ inputs.is-release-build }}
          files: distribution/build/libs/AstralPractice-${{ env.BUILD_VERSION }}.jar
          name: AstralPractice ${{ env.BUILD_VERSION }}
          version: ${{ inputs.is-release-build == true && env.BUILD_VERSION || format('{0}-build.{1}', env.BUILD_VERSION, github.run_number) }}
          version-type: ${{ inputs.release-version-type }}
          changelog: ${{ steps.changelog.outputs.notes }}
          loaders: |
            paper
            purpur
            bukkit
            spigot
          game-versions: '>=1.21.11 <=26.3'
          game-version-filter: none
          retry-attempts: 3
          retry-delay: 15000
