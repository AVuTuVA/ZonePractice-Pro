plugins {
    id 'com.gradleup.shadow' version '9.6.1' apply false
    id 'com.diffplug.spotless' version '8.10.4' apply false
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'checkstyle'
    apply plugin: 'com.diffplug.spotless'

    checkstyle {
        toolVersion = '14.3.0'
        configFile = rootProject.file('config/checkstyle/google_checks.xml')
        configProperties = [
            'org.checkstyle.google.severity': 'error',
            'org.checkstyle.google.suppressionfilter.config':
                rootProject.file('config/checkstyle/suppressions.xml').absolutePath
        ]
        maxWarnings = 0
    }

    spotless {
        java {
            googleJavaFormat('1.36.1').reflowLongStrings()
        }
    }

    tasks.withType(Checkstyle).configureEach {
        // Checkstyle needs source files only; avoid compiling the plugin to lint it.
        classpath = files()
        reports {
            xml.required = true
            html.required = true
        }
    }

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(25)
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 25
    }

    tasks.withType(ProcessResources).configureEach {
        filteringCharset = 'UTF-8'
    }
}
