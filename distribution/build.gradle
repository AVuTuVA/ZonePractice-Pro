plugins {
    id 'com.gradleup.shadow'
    // Anvil runs the shaded plugin on real Paper servers; see docs/configuration.md.
    id 'me.whereareiam.anvil'
    id 'me.whereareiam.anvil.junit'
    id 'me.whereareiam.anvil.capability.default'
    id 'me.whereareiam.anvil.platform.paper'
}

repositories {
    mavenCentral()
    maven { url = uri('https://mvn.wesjd.net/') }
    maven { url = uri('https://repo.faststats.dev/releases') }
    maven { url = uri('https://registry.whereareiam.me/maven/packages') }
    // Anvil's protocol library.
    maven { url = uri('https://repo.opencollab.dev/main/') }
    maven { url = uri('https://repo.opencollab.dev/maven-snapshots/') }
    // PacketEvents, a required server plugin, for the Anvil tests.
    exclusiveContent {
        forRepository {
            maven { url = uri('https://api.modrinth.com/maven') }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    implementation project(':core')

    anvilImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    anvilRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.3'
    anvilRuntimeOnly anvil.module('protocol-mcprotocol')
}

anvil {
    acceptEula()
    engine {
        protocolLibrary 'mcprotocol'
    }
    artifact 'plugin-under-test', tasks.named('shadowJar')
    artifact 'packetevents', 'maven.modrinth:packetevents:2.14.0+spigot'
}

tasks.named('shadowJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    archiveBaseName = 'AstralPractice'
    archiveClassifier = ''

    // ServiceLoader must find relocated MariaDB authentication plugins and JDBC drivers.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    filesMatching('META-INF/services/**') {
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }
    mergeServiceFiles()

    exclude 'META-INF/maven/**', 'META-INF/proguard/**'
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    exclude '**/module-info.class', 'org/intellij/**', 'org/jetbrains/**', 'org/jspecify/**'
    exclude '**/.DS_Store'

    relocate 'net.megavex.scoreboardlibrary', 'dev.lokspel.practice.dependencies.sidebar'
    relocate 'me.whereareiam.configura', 'dev.lokspel.practice.dependencies.configura'
    relocate 'me.whereareiam.strata', 'dev.lokspel.practice.dependencies.strata'
    relocate 'com.fasterxml.jackson', 'dev.lokspel.practice.dependencies.jackson'
    relocate 'org.yaml.snakeyaml', 'dev.lokspel.practice.dependencies.snakeyaml'
    relocate 'net.wesjd.anvilgui', 'dev.lokspel.practice.dependencies.anvilgui'
    relocate 'org.bstats', 'dev.lokspel.practice.dependencies.bstats'
    relocate 'dev.faststats', 'dev.lokspel.practice.dependencies.faststats'
    relocate 'com.google.gson', 'dev.lokspel.practice.dependencies.gson'
    relocate 'com.zaxxer.hikari', 'dev.lokspel.practice.dependencies.hikari'
    relocate 'org.mariadb.jdbc', 'dev.lokspel.practice.dependencies.mariadb'
}
